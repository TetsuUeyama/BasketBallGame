<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Basketball Lanes</title>
    <style>
      :root {
        --bg: rgba(12, 14, 18, 0.78);
        --fg: #e8ebef;
        --dim: #9aa3ad;
        --red: #ff8a80;
        --blue: #82b1ff;
        --acc: #ffe066;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111317; color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
      #c { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
      .panel { position: absolute; background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 13px;
        line-height: 1.45; pointer-events: none; }
      #score { top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center;
        font-size: 18px; font-weight: 700; padding: 6px 14px; }
      #score .red { color: var(--red); } #score .blue { color: var(--blue); }
      #score .clock { font-variant-numeric: tabular-nums; color: var(--acc); min-width: 3.2em; text-align: center; }
      #score .poss { font-size: 12px; color: var(--dim); font-weight: 400; }
      #call { top: 62px; left: 10px; max-width: 330px; }
      #call .k { color: var(--dim); }
      #call .v { font-weight: 700; }
      #opts { top: 62px; right: 10px; width: 270px; font-variant-numeric: tabular-nums; }
      #opts .row { display: grid; grid-template-columns: 88px 1fr 40px; gap: 6px; align-items: center; }
      #opts .bar { height: 7px; border-radius: 4px; background: #333a43; overflow: hidden; }
      #opts .bar > i { display: block; height: 100%; }
      #opts .best { color: var(--acc); }
      #feed { bottom: 58px; left: 10px; width: min(560px, calc(100% - 20px)); max-height: 34vh; overflow: hidden; }
      #feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #feed .score { color: var(--acc); }
      #feed .break { color: #ffab40; }
      #feed .screen { color: #b9f6ca; }
      #feed .def { color: #cfd8dc; font-style: italic; }
      #stats { bottom: 58px; right: 10px; font-variant-numeric: tabular-nums; font-size: 12px; }
      #stats table { border-collapse: collapse; }
      #stats td, #stats th { padding: 1px 6px; text-align: right; }
      #stats th { color: var(--dim); font-weight: 400; }
      #ctrl { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;
        flex-wrap: wrap; justify-content: center; width: calc(100% - 20px); }
      #ctrl .grp { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 3px; }
      #ctrl button { background: transparent; color: var(--fg); border: 0; border-radius: 6px; padding: 5px 9px;
        font-size: 13px; cursor: pointer; }
      #ctrl button.on { background: #3d4652; color: var(--acc); }
      #legend { top: 10px; right: 10px; font-size: 11px; color: var(--dim); padding: 4px 8px; }
      #legend b { font-weight: 700; }
      @media (max-width: 720px) {
        #call { top: 54px; left: 6px; right: 6px; max-width: none; font-size: 12px; }
        #opts { display: none; }
        #legend { display: none; }
        #stats { display: none; }
        #feed { bottom: 92px; font-size: 11px; max-height: 22vh; }
        #score { font-size: 15px; top: 6px; }
        #ctrl button { padding: 5px 7px; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="score" class="panel"></div>
    <div id="call" class="panel"></div>
    <div id="opts" class="panel"></div>
    <div id="feed" class="panel"></div>
    <div id="stats" class="panel"></div>
    <div id="ctrl"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
